function miniGame(cfg,done){
  const el=$('#modal');
  if(window.__AUF_AUTO){modalOpen=false;el.hidden=true;done(chance(.5));return}
  if(g.prison>0){const lv=secLv();if(lv>1){cfg=Object.assign({},cfg);const f=lv-1;if(cfg.speed)cfg.speed*=1+.35*f;if(cfg.zone)cfg.zone=Math.max(8,cfg.zone-4*f);if(cfg.fails&&lv===3)cfg.fails=Math.max(1,cfg.fails-1);if(cfg.steps&&lv===3)cfg.steps+=1;if(cfg.time)cfg.time*=1-.12*f;if(cfg.decay)cfg.decay*=1+.3*f;if(cfg.edge!=null)cfg.edge*=lv===3?.3:.6;if(cfg.len)cfg.len+=f;cfg.intro=(cfg.intro||'')+' ('+SEC[lv]+' : plus difficile.)'}}
  modalOpen=true;
  let fin=false,timer=null;const tos=[];
  const later=(f,ms)=>{tos.push(setTimeout(f,ms))};
  const stop=()=>{if(timer){clearInterval(timer);timer=null}tos.forEach(clearTimeout)};
  el.innerHTML='<div class="card ev bl"><div class="brib"><span>Mini-jeu</span></div><div class="bt"><h2>'+esc(cfg.title)+'</h2></div><p class="etx">'+esc(cfg.intro||'')+'</p><div class="mg"></div></div>';
  el.hidden=false;
  const box=el.querySelector('.mg');
  const finish=(win,msg)=>{
    if(fin)return;fin=true;stop();
    el.innerHTML='<div class="card ev bl"><div class="brib"><span>'+(win?'Réussi':'Échec')+'</span></div><div class="bt"><h2>'+esc(cfg.title)+'</h2></div><p class="res">'+esc(msg)+'</p><button class="opt" data-ok>Continuer</button></div>';
    el.onclick=e=>{if(e.target.closest('[data-ok]')){closeModal();setTimeout(()=>{if(g&&g.alive){done(win);refreshSheet()}},0)}};
  };
  const bind=fn=>{el.onclick=e=>{const b=e.target.closest('button')||e.target.closest('.mg-track');if(b&&!fin)fn(b)}};
  const K=cfg.kind;
  if(K==='timing'){
    let pos=rnd(0,100),dir=1,spd=cfg.speed*.55,steps=0,fails=0;const zone=Math.min(40,cfg.zone+8);let zs=rnd(8,92-zone);
    box.innerHTML='<div class="mg-track"><div class="mg-zone"></div><div class="mg-mark"></div></div><p class="mg-st"></p><button class="opt" data-go>'+esc(cfg.btn||'Agir')+'</button>';
    const Z=box.querySelector('.mg-zone'),M=box.querySelector('.mg-mark'),ST=box.querySelector('.mg-st');
    const draw=()=>{Z.style.left=zs+'%';Z.style.width=zone+'%';M.style.left=pos+'%';ST.textContent='Étape '+Math.min(steps+1,cfg.steps)+'/'+cfg.steps+' · Erreurs '+fails+'/'+cfg.fails};
    draw();
    timer=setInterval(()=>{pos+=dir*spd;if(pos>=97){pos=97;dir=-1}if(pos<=0){pos=0;dir=1}draw()},16);
    bind(b=>{
      if(!b.hasAttribute('data-go')&&!b.classList.contains('mg-track'))return;
      if(pos>=zs-3&&pos<=zs+zone+3){steps++;spd*=1.06;zs=rnd(8,92-zone);if(steps>=cfg.steps)finish(true,cfg.win)}
      else{fails++;if(fails>=cfg.fails)finish(false,cfg.lose)}
      draw();
    });
  }else if(K==='mash'){
    let p=10,t=cfg.time;
    box.innerHTML='<div class="mg-track"><div class="mg-bar"></div></div><p class="mg-st"></p><button class="opt" data-go>'+esc(cfg.btn||'Pousser !')+'</button>';
    const B=box.querySelector('.mg-bar'),ST=box.querySelector('.mg-st');
    const draw=()=>{B.style.width=p+'%';ST.textContent='Temps restant : '+Math.max(0,t).toFixed(1)+' s'};
    draw();
    timer=setInterval(()=>{p=Math.max(0,p-cfg.decay);t-=.05;if(p>=100)finish(true,cfg.win);else if(t<=0)finish(false,cfg.lose);draw()},50);
    bind(b=>{if(!b.hasAttribute('data-go'))return;p=Math.min(100,p+cfg.inc);draw();if(p>=100)finish(true,cfg.win)});
  }else if(K==='rps'){
    let me=0,foe=0,rd=0;const need=cfg.wins||2;
    const beats={frapper:'feinter',feinter:'parer',parer:'frapper'};
    const NM={frapper:'un coup',feinter:'une feinte',parer:'une parade'};
    box.innerHTML='<p class="mg-st"></p><p class="mg-log">Choisissez votre action.</p><div class="mg-row"><button class="opt" data-a="frapper">Frapper</button><button class="opt" data-a="feinter">Feinter</button><button class="opt" data-a="parer">Parer</button></div><p class="mg-hint">Frapper bat Feinter · Feinter bat Parer · Parer bat Frapper</p>';
    const ST=box.querySelector('.mg-st'),LG=box.querySelector('.mg-log');
    const draw=()=>{ST.textContent='Vous '+me+' – '+foe+' Adversaire (premier à '+need+')'};draw();
    bind(b=>{
      const a=b.dataset.a;if(!a)return;
      const keys=Object.keys(beats);
      let o=pick(keys);
      if(chance(cfg.edge||0))o=Object.keys(beats).find(k=>beats[a]===k)||o;
      if(a===o)LG.textContent='Vous échangez '+NM[a]+' : égalité.';
      else if(beats[a]===o){me++;LG.textContent='Votre '+NM[a].replace('un ','').replace('une ','')+' bat '+NM[o]+' !'}
      else{foe++;shake();LG.textContent='Son '+NM[o].replace('un ','').replace('une ','')+' vous prend de court.'}
      draw();
      if(me>=need)finish(true,cfg.win);else if(foe>=need)finish(false,cfg.lose);
    });
  }else if(K==='memory'){
    const cols=['#d64545','#2e9e5b','#3a7bd5','#e0a526'];
    const seq=[];for(let i=0;i<cfg.len;i++)seq.push(rnd(0,3));
    let idx=0,lock=true;
    box.innerHTML='<p class="mg-st">Mémorisez la séquence…</p><div class="mg-pad">'+cols.map((c,i)=>'<button data-k="'+i+'" style="background:'+c+'"></button>').join('')+'</div>';
    const ST=box.querySelector('.mg-st'),pads=[...box.querySelectorAll('[data-k]')];
    const flash=i=>{pads[i].classList.add('lit');later(()=>pads[i].classList.remove('lit'),320)};
    seq.forEach((k,i)=>later(()=>flash(k),700+i*560));
    later(()=>{lock=false;ST.textContent='À vous : répétez la séquence.'},700+seq.length*560);
    bind(b=>{
      if(lock||b.dataset.k==null)return;
      const k=+b.dataset.k;flash(k);
      if(k!==seq[idx]){finish(false,cfg.lose);return}
      idx++;ST.textContent='Bien : '+idx+'/'+seq.length;
      if(idx>=seq.length)finish(true,cfg.win);
    });
  }
}

  ];

  showModal({title:'Procès',nosurp:true,sit:true,rib:'Situation',ic:'scales',text:pick(lines)+' Vous êtes jugé'+genre('','e')+' pour '+ctx.what+'. Comment vous défendre ?',choices});

function judge(ctx,o){
  const [label,p,cost,plead]=o;
  g.money-=cost;
  let pAcq=p;if(ctx.deny&&cost>0)pAcq+=.05;
  const acquitted=!plead&&chance(clamp(pAcq,0,.9));
  let msg='Le jury délibère… ';
  if(ctx.resisted){g.money-=px(500)}
  if(acquitted){
    d({happy:8});g.wanted=Math.max(0,(g.wanted||0)-2);
    return msg+'Verdict : non coupable ! Vous sortez libre du tribunal.';
  }
  g.record++;g.wanted=Math.max(0,(g.wanted||0)-2);
  if(ctx.term){
    let n=rnd(ctx.term[0],ctx.term[1]);
    if(plead)n=Math.ceil(n*.6);
    if(ctx.coop)n=Math.ceil(n*.85);
    if(ctx.resisted)n=Math.ceil(n*1.3);
    if(ctx.fled)n+=1;
    if(ctx.bribeFail)n+=1;
    if(ctx.juv||g.age<18)n=Math.max(1,Math.round(n/2));
    g.prison=n;g.everPrison=true;g.job=null;g.uni=null;g.school.in=false;d({happy:-15});
    return msg+(plead?'Vous plaidez coupable : ':'Verdict : coupable. ')+'Vous êtes condamné'+genre('','e')+' à '+n+' an'+(n>1?'s':'')+' de prison.';
  }
  let m=px(ctx.fine||300);if(cost>=px(5000))m=Math.ceil(m*.6);if(plead)m=Math.ceil(m*.7);
  g.money-=m;d({happy:-4});
  return msg+(plead?'Vous plaidez coupable : ':'Verdict : coupable. ')+'Vous écopez d\'une amende de '+eur(m)+' et d\'un casier.';
}

function seeDoctor(reason){
  if(!g||!g.alive)return;
  closeSheet();
  const kid=g.age<18,c1=kid?0:px(80),c2=kid?0:px(350);
  const n1='Dr '+rsur(),n2='Pr '+rsur();
  const lab=(n,t,c)=>n+' · '+t+(kid?' · pris en charge par vos parents':' · '+eur(c));
  const choices=[];
  if(g.money>=c1)choices.push(ch(lab(n1,'médecin généraliste',c1),()=>diagnose({q:.75,spec:false,cost:c1,name:n1})));
  if(g.money>=c2)choices.push(ch(lab(n2,'spécialiste réputé',c2),()=>diagnose({q:.95,spec:true,cost:c2,name:n2})));
  choices.push(ch('Ne pas consulter',()=>g.ill&&g.ill.known===false?'Vous préférez attendre. Les symptômes persistent.':'Vous renoncez à la consultation.'));
  showModal({title:'Médecin',sit:true,nosurp:true,rib:'Situation',ic:'steth',text:reason==='sick'?'Vous ne vous sentez pas bien depuis quelques jours. Quel médecin consultez-vous ?':'Vous prenez rendez-vous pour une consultation. Quel médecin choisissez-vous ?',choices});
}
function diagnose(o){
  g.money-=o.cost;
  if(g.ill){
    if(chance(o.q)){
      g.ill.known=true;
      enqueue(()=>prescribe(o));
      return o.name+' vous examine longuement, puis pose son diagnostic : « Vous souffrez de cette maladie : '+g.ill.name+'. »';
    }
    return o.name+' ne trouve rien d\'anormal et vous renvoie chez vous, mais les symptômes persistent.';
  }
  d({health:rnd(1,5)});
  if(o.spec&&chance(.08)){
    const I=pick(ILLS.filter(i=>g.age>=i.min&&i.sev<=2));
    if(I){g.ill={name:I.n,sev:I.sev,cure:I.cure,years:0,known:true};enqueue(()=>prescribe(o));return o.name+' détecte une anomalie à un stade précoce : « Vous souffrez de : '+I.n+'. »'}
  }
  return o.name+' vous examine soigneusement : « Vous êtes en parfaite santé. »';
}
function prescribe(o){
  if(!g||!g.ill)return;
  const kid=g.age<18,cost=kid?0:px(g.ill.sev*800);
  const choices=[];
  if(g.money>=cost)choices.push(ch('Suivre le traitement'+(kid?'':' ('+eur(cost)+')'),()=>{
    g.money-=cost;
    if(chance(clamp((o.spec?.55:.35)+g.ill.cure*.5,.1,.95))){const n=g.ill.name;g.ill=null;g.flags.survivor=true;d({happy:6});return 'Le traitement fait effet : vous êtes guéri'+genre('','e')+' de : '+n+'.'}
    g.ill.sev=Math.max(1,g.ill.sev-1);return 'Le traitement ralentit la maladie sans la guérir. Il faudra poursuivre les soins.';}));
  choices.push(ch('Refuser le traitement',()=>{d({happy:-3});return 'Vous préférez ne pas suivre de traitement pour l\'instant.'}));
  showModal({title:'Traitement',sit:true,nosurp:true,rib:'Situation',ic:'pill',text:o.name+' vous prescrit un traitement pour : '+g.ill.name+'.'+(kid?' Vos parents s\'occupent des frais.':''),choices});
}

  const back=document.createElement('button');back.className='btn alt';back.id='btn-back';back.type='button';back.textContent='← Retour aux personnages';

function floatTxt(txt,cls,x,y){

function animRender(){
  if(!g||$('#game').hidden)return;
  const cur={happy:g.happy,health:g.health,smarts:g.smarts,looks:g.looks};
  const rows=document.querySelectorAll('#stats .st');
  if(prevS&&prevS._id===(g.name+g.surname+g.year0)){
    ['happy','health','smarts','looks'].forEach((k,i)=>{
      const dlt=Math.round(cur[k])-Math.round(prevS[k]);
      if(dlt&&rows[i]){
        rows[i].classList.add(dlt>0?'up':'down');setTimeout(()=>rows[i]&&rows[i].classList.remove('up','down'),900);
        const r=rows[i].getBoundingClientRect(),ar=$('#app').getBoundingClientRect();
        floatTxt((dlt>0?'+':'')+dlt+'%',dlt>0?'plus':'minus',r.right-ar.left-70,r.top-ar.top-4);
      }
    });
    const dm=Math.round(g.money-prevM);
    if(dm){
      const m=$('#h-money'),r=m.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();
      m.classList.add('pulse');setTimeout(()=>m.classList.remove('pulse'),700);
      floatTxt((dm>0?'+':'−')+eur(Math.abs(dm)),dm>0?'plus':'minus',Math.max(8,r.left-ar.left-30),r.bottom-ar.top+2);
    }
  }
  prevS=Object.assign({_id:(g.name+g.surname+g.year0)},cur);prevM=g.money;
  const lb=$('#log .blk:last-child');if(lb)lb.classList.add('fresh');
}

  for(let i=0;i<(n||46);i++){const p=document.createElement('i');p.style.left=rnd(2,98)+'%';p.style.background=pick(cols);p.style.animationDelay=(Math.random()*.5)+'s';p.style.animationDuration=(1.6+Math.random()*1.4)+'s';p.style.setProperty('--dx',rnd(-80,80)+'px');p.style.transform='rotate('+rnd(0,360)+'deg)';w.appendChild(p)}

}

const FXK={h:'happy',v:'health',s:'smarts',l:'looks',k:'karma',$:'money',f:'fame',F:'followers',p:'perf',w:'wanted'};
function fxp(s){const o={};if(!s)return o;s.trim().split(/\s+/).forEach(t=>{if(t==='!'){o.fn=()=>{enqueue(()=>arrest({what:'vos crimes et votre cavale',term:[2,8],fine:0}))};return}const m=/^([hvslk$fFpwr])([+-]\d+)$/.exec(t);if(!m)return;if(m[1]==='r')o.rel=['ALL',+m[2]];else o[FXK[m[1]]]=+m[2]});return o}
const TAGS={cav:g=>!!g.fugitive,job:g=>!!g.job&&g.prison<=0,home:g=>hasHome(),partner:g=>!!partner(),kids:g=>g.kids>0,car:g=>g.assets.some(a=>a.cat==='car'),pet:g=>hasPet(),school:g=>!!(g.school&&g.school.in),single:g=>!partner(),rich:g=>g.money>20000,poor:g=>g.money<3000,uni:g=>!!g.uni,retired:g=>!!g.retired||g.age>=65,fame:g=>g.fame>=20};
const TICON={cav:'mask',job:'bag',home:'home',partner:'heart',kids:'baby',car:'car',pet:'paw',school:'cap',rich:'money',poor:'money',uni:'cap',fame:'star'};
let DEVN=0;
function DEV(a,b,text,...cs){
  const m=/^\[([a-z,]+)\]/.exec(text);let tags=[];if(m){tags=m[1].split(',');text=text.slice(m[0].length)}
  const id='x'+(++DEVN);
  const cat=tags.includes('cav')?'Cavale':b<18?'Jeunesse':tags.includes('job')?'Travail':tags.includes('partner')||tags.includes('single')?'Amour':tags.includes('home')||tags.includes('car')?'Maison':a>=60?'Vieillesse':'Vie';
  const ic=TICON[tags.find(t=>TICON[t])]||(b<18?'cap':'star');
  EVT(id,cat,g=>g.age>=a&&g.age<=b&&tags.every(t=>!TAGS[t]||TAGS[t](g)),text,()=>cs.map(c=>{
    const p=c.split('|');const l=p[0],pr=+p[1],okm=p[2],okf=fxp(p[3]),kom=p[4],kof=fxp(p[5]);
    return KO(l,[pr,okm,okf],[1,kom||okm,kom?kof:okf]);
  }),ic);
}

const cnt=(p,k)=>((p.fl=p.fl||{})[k]||0);
const use=(p,k)=>{p.fl=p.fl||{};p.fl[k]=(p.fl[k]||0)+1};
const cntS=(p,k)=>cnt(p,k)>=2?'Déjà fait 2 fois cette année':cnt(p,k)?'Fait '+cnt(p,k)+'/2 cette année':'';
/* pays où les relations entre personnes du même sexe sont interdites (liste approximative) */
const HOMO_BAN='AF DZ BD BN BI CM TD KM EG ER SZ ET GM GH GN IR IQ KE KW LB LY MW MY MV MR MA MM NG OM PK QA SA SN SL SO SS LK SD SY TZ TG TN TM UG AE UZ YE ZM ZW ML BF JM KI TV WS TO SB PG DM GD KN LC VC GY CK RU'.split(' ');
const homoBan=()=>HOMO_BAN.includes(g.cc);
const sameSex=p=>p&&p.gender===g.gender&&p.kind!=='pet'&&['partner','spouse','ami'].includes(p.kind);
function lawRisk(p,pr,what){
  if(!g||!g.alive||g.prison>0||!sameSex(p)||!homoBan())return false;
  if(!chance(pr))return false;
  closeSheet();
  const harsh=g.cc==='BN'||g.cc==='SA'||g.cc==='IR';
  enqueue(()=>arrest({what:what||'une relation homosexuelle, interdite dans ce pays',term:harsh?[4,12]:[1,5],fine:0}));
  return true;
}
function lawYear(){
  const p=g.rels.find(r=>r.alive&&(r.kind==='partner'||r.kind==='spouse')&&sameSex(r));
  if(p&&homoBan()&&g.prison<=0){
    if(chance(.07)){L('Des voisins vous dénoncent : votre relation est illégale ici.','bad');lawRisk(p,1,'une relation homosexuelle, interdite dans ce pays')}
    else if(g.age>=14&&!g.flags.lawWarned){g.flags.lawWarned=true;L('Dans ce pays, votre relation avec '+p.name+' est illégale. Soyez prudent'+genre('','e')+'.','bad')}
  }
}
function fertile(p){
  if(!p||p.gender===g.gender)return false;
  const f=p.gender==='f'?p:g;return f.age>=15&&f.age<=47;
}
function intimate(p,id){
  const lover=p.kind==='partner'||p.kind==='spouse';
  if(!lover){
    const compat=g.orient==='bi'||(g.orient==='het'&&p.gender!==g.gender)||(g.orient==='homo'&&p.gender===g.gender);
    if(!compat||!chance(Math.min(.85,p.rel/100)*(p.rel>=55?1:.4))){
      use(p,'night');d({happy:-3});p.rel=clamp(p.rel-4);say(p.name+' n\'est pas intéressé'+(p.gender==='f'?'e':'')+' par cette idée.','bad');openPerson(id);return;
    }
  }
  const can=fertile(p);
  const after=()=>{
    if(!lover&&!g.rels.some(r=>(r.kind==='partner'||r.kind==='spouse')&&r.alive)&&chance(.35)){p.kind='partner';L('Vous êtes maintenant en couple avec '+p.name+'.','good')}
    if(lawRisk(p,.35))return;
    openPerson(id);
  };
  const base={happy:6,rel:['ALL',0]};
  const ch1=can?[ch('Essayer d\'avoir un enfant',()=>{use(p,'night');const w=chance(.4);if(w)haveChild(p);else{d({happy:4});say('Une nuit tendre. Pas de bonne nouvelle pour l\'instant.')}p.rel=clamp(p.rel+5);setTimeout(after,0);return ''})]:[];
  showModal({title:'Intimité',nosurp:true,rib:'Situation',sit:true,ic:'heart',text:'Vous passez une soirée très tendre avec '+p.name+'.'+(can?' Voulez-vous un enfant ?':' Quelles précautions prenez-vous ?'),choices:[
    ...ch1,
    ch('Avec protection',()=>{use(p,'night');p.rel=clamp(p.rel+4);d({happy:5});let m='Une belle soirée, sans conséquence.';if(can&&chance(.03)){haveChild(p);m='Une surprise inattendue : un bébé est en route !'}setTimeout(after,0);return m}),
    ch('Sans protection',()=>{use(p,'night');p.rel=clamp(p.rel+4);d({happy:5});let m='Une belle soirée, sans conséquence.';if(can&&chance(g.age>40?.08:.2)){haveChild(p);m='Quelques semaines plus tard, un bébé est en route !'}else if(chance(.05)){d({health:-5});if(!g.ill)g.ill={name:'Infection',sev:2,cure:.6,years:0};m='Un examen révèle une infection.'}setTimeout(after,0);return m}),
    ch('Renoncer',()=>{setTimeout(()=>openPerson(id),0);return ''})]});
}

const hadBirth=()=>g.lastBirth===g.age;
const _hc=haveChild;
haveChild=function(par){
  if(hadBirth()){L('Un seul enfant par an : la grossesse est repoussée.');return false}

};

/* satisfaction */
function pleasureCard(p,score,msg,done){
  if(window.__AUF_AUTO){if(done)done();return}
  const el=$('#modal');modalOpen=true;
  const lab=score>=80?'Extase':score>=60?'Très satisfaisant':score>=40?'Satisfaisant':score>=20?'Décevant':'Désastreux';
  el.innerHTML='<div class="card ev bl"><div class="brib"><span>Intimité</span></div><div class="bt"><h2>Satisfaction</h2></div><p class="res">'+esc(msg)+'</p>'+
    '<div style="padding:0 22px;margin:4px 0 12px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:#4a0a10;margin-bottom:4px"><span>Plaisir · '+lab+'</span><span>'+score+'%</span></div>'+
    '<div class="bar" style="height:16px;background:rgba(0,0,0,.12)"><i id="plb" style="display:block;height:100%;width:0;background:#e8467c;transition:width 1s ease-out"></i></div></div>'+
    '<button class="opt" data-ok>Continuer</button></div>';
  el.hidden=false;
  setTimeout(()=>{const b=document.getElementById('plb');if(b)b.style.width=score+'%'},60);
  el.onclick=e=>{if(e.target.closest('[data-ok]')){closeModal();if(done)done()}};
}
function intimate(p,id){
  const lover=p.kind==='partner'||p.kind==='spouse';
  if(!lover){
    const compat=g.orient==='bi'||(g.orient==='het'&&p.gender!==g.gender)||(g.orient==='homo'&&p.gender===g.gender);
    if(!compat||!chance(Math.min(.85,p.rel/100)*(p.rel>=55?1:.4))){
      use(p,'night');d({happy:-3});p.rel=clamp(p.rel-4);say(p.name+' n\'est pas intéressé'+(p.gender==='f'?'e':'')+' par cette idée.','bad');openPerson(id);return;
    }
  }
  const can=fertile(p)&&!hadBirth();
  const after=()=>{
    if(!lover&&!g.rels.some(r=>(r.kind==='partner'||r.kind==='spouse')&&r.alive)&&chance(.35)){p.kind='partner';L('Vous êtes maintenant en couple avec '+p.name+'.','good')}
    if(lawRisk(p,.35))return;
    openPerson(id);
  };
  const score=(bonus)=>clamp(Math.round(30+p.rel*.35+g.health*.08+g.looks*.08+rnd(-8,22)+(bonus||0)),3,100);
  const finish=(sc,msg)=>{d({happy:Math.max(1,Math.round(sc/12))});p.rel=clamp(p.rel+Math.round(sc/14));setTimeout(()=>pleasureCard(p,sc,msg,after),0);return ''};
  const note=hadBirth()&&fertile(p)?' Vous avez déjà eu un enfant cette année : un seul par an.':'';
  const choices=[];
  if(can)choices.push(ch('Essayer d\'avoir un enfant',()=>{use(p,'night');const sc=score(4);let m='Une nuit tendre. Pas de bonne nouvelle pour l\'instant.';if(chance(.4)&&haveChild(p))m='Une nuit tendre… et un bébé est en route !';return finish(sc,m)}));
  choices.push(ch('Sans enfant, avec protection',()=>{use(p,'night');return finish(score(0),'Une belle soirée, sans conséquence.')}));
  choices.push(ch('Sans protection',()=>{use(p,'night');const sc=score(5);let m='Une belle soirée, sans conséquence.';
    if(can&&chance(g.age>40?.08:.2)&&haveChild(p))m='Quelques semaines plus tard, un bébé est en route !';
    else if(chance(.05)){d({health:-5});if(!g.ill)g.ill={name:'Infection',sev:2,cure:.6,years:0};m='Un examen révèle une infection.'}
    return finish(sc,m)}));
  choices.push(ch('Renoncer',()=>{setTimeout(()=>openPerson(id),0);return ''}));
  showModal({title:'Intimité',nosurp:true,rib:'Situation',sit:true,ic:'heart',text:'Vous passez une soirée très tendre avec '+p.name+'. Vous n\'êtes pas obligé'+genre('','e')+' d\'avoir un enfant.'+note,choices});
}

function willAmount(p){
  const k=p.kind,b=g.fw/40;
  const pr={mere:.7,pere:.7,spouse:.8,partner:.3,frere:.3,soeur:.3,ami:.12,child:0}[k]||.25;
  if(g.age<18||!chance(pr*(0.5+p.rel/100)))return 0;
  const base={mere:[6000,30000],pere:[6000,30000],spouse:[10000,60000],partner:[3000,15000]}[k]||[500,6000];
  return Math.round(px(rnd(base[0],base[1])*Math.max(.4,b)));
}

/* ---------- patch 11 : suites d'événements, petite enfance, permis, satisfaction ---------- */
const _fxp0=fxp;
fxp=function(s){
  const fol=[],rx=[];
  const rest=(s||'').trim().split(/\s+/).filter(t=>{
    if(t[0]==='>'){fol.push(t.slice(1));return false}
    const m=/^([aexy])([+-]\d+)$/.exec(t);
    if(m){rx.push([{a:'AMI',e:'FAM',x:'LOV',y:'PAR'}[m[1]],+m[2]]);return false}
    return true}).join(' ');
  const o=_fxp0(rest);
  if(fol.length||rx.length){const f0=o.fn;o.fn=()=>{if(f0)f0();rx.forEach(r=>fxGo({rel:r}));fol.forEach(x=>{const q=x.split(':');schedule(q[0],+q[1]||1)})}}
  return o;
};
function schedule(id,yrs){(g.pend=g.pend||[]).push({id,age:g.age+(yrs||1)})}
const _pe=pickEvent;
pickEvent=function(used){
  used=used||[];
  if(g.prison<=0&&!g.fugitive&&g.pend&&g.pend.length){
    const i=g.pend.findIndex(x=>x.age<=g.age);
    if(i>=0){const x=g.pend.splice(i,1)[0];const e=EVENTS.find(y=>y.id===x.id);if(e&&!used.includes(e.id)){g.lastEv=e.id;return e}}
  }
  return _pe(used);
};
/* suites : arrivent quelques années après un choix */
function FUP(id,text,...cs){
  EVT(id,'Conséquence',()=>false,text,()=>cs.map(c=>{
    const p=c.split('|');return KO(p[0],[+p[1],p[2],fxp(p[3])],[1,p[4]||p[2],p[4]?fxp(p[5]):fxp(p[3])]);
  }),'clock');
}
/* petite enfance */
const BEVL=[];
function BEV(a,b,text,...cs){BEVL.push({a,b,text,cs})}
function showBaby(e){
  showModal({title:'Petite enfance',rib:'Situation',sit:true,ic:'baby',text:e.text,choices:e.cs.map(c=>{const p=c.split('|');
    return KO(p[0],[+p[1],p[2],fxp(p[3])],[1,p[4]||p[2],p[4]?fxp(p[5]):fxp(p[3])])})});
}
const _by2=babyYear;
babyYear=function(){
  _by2();
  if(g.age<1||g.age>4||g.prison>0)return;
  const rec=g.recentB||(g.recentB=[]);
  let pool=BEVL.filter(e=>g.age>=e.a&&g.age<=e.b);
  const fresh=pool.filter(e=>!rec.includes(e.text));if(fresh.length)pool=fresh;
  for(let i=0;i<2&&pool.length;i++){const e=pick(pool);pool=pool.filter(x=>x!==e);rec.push(e.text);if(rec.length>70)rec.shift();enqueue(()=>showBaby(e))}
};

let FAV=null;
EVT('favor','Relations',g=>g.age>=12&&g.rels.some(r=>r.alive&&r.kind!=='pet'&&r.rel>=25&&r.age>=8),()=>{
  const c=g.rels.filter(r=>r.alive&&r.kind!=='pet'&&r.rel>=25&&r.age>=8);
  const p=pick(c);const t=rnd(0,3);const amt=px(rnd(300,2500));
  FAV={p,t,amt};
  return [
    p.name+' vous demande de lui prêter '+eur(amt)+' « jusqu\'à la fin du mois ».',
    p.name+' vous demande de l\'aider à déménager ce week-end.',
    p.name+' vous demande de dire que vous étiez ensemble hier soir.',
    p.name+' vous demande de venir le/la soutenir à un moment difficile.'
  ][t];
},()=>{
  const F=FAV;if(!F)return [ch('Continuer',()=>'')];
  const {p,t,amt}=F,rel=n=>{p.rel=clamp(p.rel+n)};
  if(t===0)return [
    ch('Lui prêter la somme',()=>{if(g.money<amt){rel(-4);return 'Vous n\'avez pas assez d\'argent. '+p.name+' est déçu(e).'}g.money-=amt;rel(10);d({happy:2});if(chance(.5))schedule('f_dette',2);return 'Vous prêtez '+eur(amt)+' à '+p.name+'.'}),
    ch('Lui en prêter la moitié',()=>{const m=Math.round(amt/2);if(g.money<m){rel(-3);return 'Vous n\'avez pas assez.'}g.money-=m;rel(5);if(chance(.3))schedule('f_dette',2);return 'Vous prêtez '+eur(m)+', c\'est un compromis.'}),
    ch('Refuser',()=>{rel(-12);if(chance(.45))schedule('f_rancune',2);d({happy:-2});return p.name+' le prend mal et vous le fait savoir.'})];
  if(t===1)return [
    ch('Aider tout le week-end',()=>{rel(10);d({happy:3,health:-3});return 'Vous portez des cartons toute la journée. '+p.name+' est reconnaissant(e).'}),
    ch('Venir deux heures seulement',()=>{rel(4);return 'Vous aidez un peu : c\'est mieux que rien.'}),
    ch('Invoquer un empêchement',()=>{rel(-9);if(chance(.35))schedule('f_rancune',2);return p.name+' sait que vous mentez et se vexe.'})];
  if(t===2)return [
    ch('Mentir pour l\'aider',()=>{rel(14);g.karma=clamp(g.karma-5);if(chance(.3)){g.karma=clamp(g.karma-3);d({happy:-4});return 'Le mensonge est découvert : vous êtes impliqué(e) dans une sale histoire.'}return 'Vous couvrez '+p.name+'. Il/elle vous doit une fière chandelle.'}),
    ch('Dire la vérité',()=>{rel(-14);g.karma=clamp(g.karma+3);if(chance(.4))schedule('f_rancune',2);return 'Vous restez honnête. '+p.name+' se fâche.'}),
    ch('Éviter de répondre',()=>{rel(-5);return p.name+' comprend que vous ne voulez pas vous mêler de ça.'})];
  return [
    ch('Y aller sans attendre',()=>{rel(12);d({happy:2});return 'Votre présence compte énormément pour '+p.name+'.'}),
    ch('Appeler au téléphone',()=>{rel(5);return 'Vous passez une heure au téléphone. C\'est déjà beaucoup.'}),
    ch('Ne rien faire',()=>{rel(-12);d({happy:-2});return p.name+' se sent abandonné(e).'})];
},'people');

  const el=$('#modal');modalOpen=true;let i=0,ok=0;
  const Q=qs.map(q=>{const opts=q[1].map((t,k)=>({t,c:k===q[2]})).sort(()=>Math.random()-.5);return {q:q[0],opts}});
  const draw=()=>{const q=Q[i];el.innerHTML='<div class="card ev bl sit"><div class="brib"><span>Question '+(i+1)+' / '+Q.length+'</span></div><div class="bt"><h2>'+esc(title)+'</h2></div><p class="etx">'+esc(q.q)+'</p>'+q.opts.map((o,k)=>'<button class="opt" data-q="'+k+'">'+esc(o.t)+'</button>').join('')+'</div>';el.hidden=false};
  el.onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.q==null)return;if(Q[i].opts[+b.dataset.q].c)ok++;i++;if(i>=Q.length){el.hidden=true;modalOpen=false;done(ok>=need,ok)}else draw()};
  draw();
}
function startExam(){
  if(g.license){toast('Vous avez déjà le permis.');return}
  if(g.age<licAge()){toast('Âge minimum : '+licAge()+' ans.');return}
  if(g.did.permis){toast('Déjà tenté cette année.');return}
  if(g.prison>0){toast('Impossible en prison.');return}
  const fee=px(1500),par=g.age<=25&&g.rels.some(r=>r.alive&&(r.kind==='mere'||r.kind==='pere')&&r.rel>=20),minor=g.age<18||par;
  if(!minor&&g.money<fee){toast('Il faut '+eur(fee)+'.');return}
  g.did.permis=1;
  if(!minor)g.money-=fee;
  const prac=()=>miniGame({kind:'timing',title:'Examen de conduite',intro:'Créneau, rond-point, feu orange : gardez votre calme sous l\'œil de l\'examinateur.',speed:1.7,zone:22+Math.round(g.smarts/20),steps:4,fails:2,btn:'Manœuvrer',win:'L\'examinateur sourit : « C\'est bon. »',lose:'Vous calez au démarrage.'},win=>{
    if(win){g.license=true;d({happy:10});say('Vous obtenez votre permis de conduire !'+(par?' Vos parents ont payé l\'examen.':''),'good');if(par&&chance(1/3))giftCar()}
    else{d({happy:-5});say('Vous échouez à l\'épreuve de conduite. Vous pourrez retenter l\'an prochain.','bad')}
  });
  if(g.codeOk){prac();return}
  const qs=QZ.slice().sort(()=>Math.random()-.5).slice(0,6);
  quiz('Code de la route',qs,5,(w,n)=>{
    if(w){g.codeOk=true;L('Vous réussissez le code ('+n+'/6).','good');prac()}
    else{d({happy:-4});say('Vous échouez au code ('+n+'/6). Il faudra retenter l\'an prochain.','bad')}
  });
}
getLicense=function(){startExam()};

const SAT_SKIP=['Tuer','Frapper','Rompre','Divorcer','Passer la nuit ensemble'];
const _os3=openSheet;
openSheet=function(o){
  if(o&&o.sub&&/· Relation \d+\/100/.test(o.sub)&&o.items&&g){
    const p=g.rels.find(r=>r.alive&&r.name===o.title);
    if(p)o.items.forEach(it=>{

      it.fn=function(){window.__sat={p,b:p.rel,hp:g.happy};try{return f.apply(this,arguments)}finally{setTimeout(()=>{window.__sat=null},0)}};

const grave=ctx=>!!(ctx&&ctx.term&&ctx.term[1]>=12);
const LATIN='MX GT HN SV NI CR PA CU DO HT JM TT BZ BS BB'.split(' ');
const corrupt=()=>{const C=CC[g.cc];return !!C&&(C.cont==='AF'||C.cont==='SA'||LATIN.includes(g.cc))};
arrest=function(ctx){
  if(!g||!g.alive)return;
  g.fugitive=false;
  const G=grave(ctx),lock=g.fledAge===g.age;
  const bribe=px(rnd(3000,8000));
  const intro=pick(['Des sirènes retentissent : la police vous encercle.','Des policiers surgissent et vous plaquent contre un mur.','Une voiture de police vous bloque la route.','Une lampe torche vous aveugle : « Police, ne bougez plus ! »']);
  const choices=[
   ch('Coopérer',()=>{ctx.coop=true;enqueue(()=>trial(ctx));return 'Vous levez les mains et suivez les agents sans résister. Direction le commissariat.'}),
   ch('Nier en bloc',()=>{ctx.deny=true;enqueue(()=>trial(ctx));return 'Vous jurez que ce n\'est pas vous. Les policiers échangent un regard sceptique et vous emmènent.'})
  ];
  if(!G&&!lock){
    choices.splice(1,0,ch('S\'enfuir',()=>{enqueue(()=>flee(ctx));return ''}),ch('Résister',()=>{enqueue(()=>resistPolice(ctx));return ''}));
    if(g.money>=bribe)choices.splice(3,0,ch('Soudoyer les policiers ('+eur(bribe)+')',()=>{
      if(chance(.35)){g.money-=bribe;g.karma=clamp(g.karma-4);return 'L\'un des agents empoche l\'enveloppe, se tourne et regarde ailleurs. Vous êtes libre… cette fois.'}
      g.money-=bribe;ctx.bribeFail=true;enqueue(()=>trial(ctx));return 'Les policiers refusent et ajoutent une tentative de corruption à vos charges.'}));
  }
  if(G)choices.splice(1,0,ch('Tenter de fuir (5 % de chances)',()=>{
    if(chance(.05)){g.fugitive=true;g.fledAge=g.age;g.wanted=(g.wanted||0)+4;g.karma=clamp(g.karma-6);d({happy:-3});return 'Contre toute attente, vous profitez d\'une seconde d\'inattention et vous disparaissez : vous voilà en cavale, activement recherché'+genre('','e')+'.'}
    ctx.fled=true;d({health:-rnd(5,15)});shake();enqueue(()=>trial(ctx));return 'Vous courez de toutes vos forces, mais les agents vous plaquent au sol. Votre tentative de fuite alourdit votre cas.'}));
  if(G&&corrupt()){const gb=px(rnd(30000,80000));if(g.money>=gb)choices.splice(2,0,ch('Soudoyer les policiers ('+eur(gb)+')',()=>{
    g.money-=gb;
    if(chance(.3)){g.karma=clamp(g.karma-6);return 'Dans ce pays, tout s\'achète : une grosse enveloppe plus tard, la porte de la cellule s\'ouvre. Vous êtes libre… pour l\'instant.'}
    ctx.bribeFail=true;enqueue(()=>trial(ctx));return 'Les policiers prennent l\'argent, mais l\'affaire est trop médiatisée : ils vous arrêtent quand même et ajoutent une tentative de corruption.'}))}
  const note=G?(corrupt()?' Les faits sont graves, mais dans ce pays la corruption est courante : un pot-de-vin reste possible, très cher.':' Les faits sont trop graves : fuir est presque impossible, et un pot-de-vin ne servirait à rien.'):(lock?' Vous avez déjà échappé à la police cette année : cette fois, ils ne vous lâchent plus d\'une semelle.':'');
  showModal({title:'Arrestation',nosurp:true,sit:true,rib:'Situation',ic:'shield',text:intro+' Vous êtes soupçonné'+genre('','e')+' de '+ctx.what+'.'+note+' Que faites-vous ?',choices});
};
trial=function(ctx){
  if(!g||!g.alive)return;
  const G=grave(ctx),heavy=ctx.term&&ctx.term[1]>=10;
  const lines=['Après une nuit en garde à vue, le procureur vous présente devant le juge.','On vous place en détention provisoire jusqu\'à l\'audience.','Le commissariat vous interroge pendant des heures avant le renvoi devant le tribunal.'];
  const base=heavy?-.1:0;
  const opts=G?[
   ['Avocat commis d\'office (gratuit)',0,0,false],
   ['Avocat privé ('+eur(px(5000))+')',0,px(5000),false],
   ['Avocat star ('+eur(px(30000))+')',0,px(30000),false],
   ['Se défendre seul',0,0,false],
   ['Plaider coupable',0,0,true]
  ]:[
   ['Avocat commis d\'office (gratuit)',.22+base,0,false],
   ['Avocat privé ('+eur(px(5000))+')',.45+base,px(5000),false],
   ['Avocat star ('+eur(px(30000))+')',.7+base,px(30000),false],
   ['Se défendre seul',.12+(g.smarts>70?.1:0)+base,0,false],
   ['Plaider coupable',0,0,true]
  ];
  const choices=opts.filter(o=>o[2]<=g.money).map(o=>ch(o[0],()=>judge(ctx,o)));
  showModal({title:'Procès',nosurp:true,sit:true,rib:'Situation',ic:'scales',text:pick(lines)+' Vous êtes jugé'+genre('','e')+' pour '+ctx.what+'.'+(G?' Les preuves sont accablantes : vous ne pouvez pas être acquitté, un bon avocat peut seulement réduire la peine.':'')+' Comment vous défendre ?',choices});
};
judge=function(ctx,o){
  const [label,p,cost,plead]=o,G=grave(ctx);
  g.money-=cost;
  let pAcq=p;if(ctx.deny&&cost>0)pAcq+=.05;
  const acquitted=!G&&!plead&&chance(clamp(pAcq,0,.9));
  let msg='Le jury délibère… ';
  if(ctx.resisted){g.money-=px(500)}
  if(acquitted){
    d({happy:8});g.wanted=Math.max(0,(g.wanted||0)-2);
    return msg+'Verdict : non coupable ! Vous sortez libre du tribunal.';
  }
  g.record++;g.wanted=Math.max(0,(g.wanted||0)-2);
  if(ctx.term){
    let n=rnd(ctx.term[0],ctx.term[1]);
    if(plead)n=Math.ceil(n*.6);
    if(G&&!plead)n=Math.max(1,Math.round(n*(cost>=px(30000)?.7:cost>=px(5000)?.85:/commis/.test(label)?.95:1)));
    if(ctx.coop)n=Math.ceil(n*.85);
    if(ctx.resisted)n=Math.ceil(n*1.3);
    if(ctx.fled)n+=1;
    if(ctx.bribeFail)n+=1;
    if(ctx.juv||g.age<18)n=Math.max(1,Math.round(n/2));
    g.prison=n;g.everPrison=true;g.job=null;g.uni=null;g.school.in=false;d({happy:-15});
    enqueue(()=>showModal({title:'Verdict',rib:'Condamnation',ic:'scales',text:'Vous êtes condamné'+genre('','e')+' à '+n+' an'+(n>1?'s':'')+' de prison.',choices:[ch('Aller en prison',()=>'')]}));
    return msg+(plead?'Vous plaidez coupable : ':'Verdict : coupable. ')+'La sentence va tomber.';
  }
  let m=px(ctx.fine||300);if(cost>=px(5000))m=Math.ceil(m*.6);if(plead)m=Math.ceil(m*.7);
  g.money-=m;d({happy:-4});
  return msg+(plead?'Vous plaidez coupable : ':'Verdict : coupable. ')+'Vous écopez d\'une amende de '+eur(m)+' et d\'un casier.';
};
/* visas */
const visaBlock=()=>g.fugitive?'Vous êtes en cavale : aucune ambassade ne traitera votre dossier.':g.prison>0?'Vous êtes en prison.':(g.record>=4||(g.record>=3&&g.everPrison))?'Votre casier judiciaire est trop lourd : le pays refuse d\'examiner votre demande.':null;
const _emig=emigrate;
emigrate=function(iso,city){
  const C=CC[iso],t=tierOf(iso),fee=px(500+t*300),route=px(4000);
  const blk=visaBlock();
  const choices=[];
  if(!blk)choices.push(ch('Demander un visa ('+eur(fee)+')',()=>{
    if(g.did['visa'+iso]){return 'Vous avez déjà déposé un dossier pour ce pays cette année.'}
    if(g.money<fee+px(3000))return 'Il vous faut '+eur(fee)+' de frais de visa et '+eur(px(3000))+' pour le déménagement.';
    g.did['visa'+iso]=1;g.money-=fee;
    const pa=clamp(.7+(g.smarts-50)/250+(g.money>px(50000)?.1:0)+(g.job?.06:0)-g.record*.15-(t>=3?.1:0)-(t>=4?.1:0),.05,.92);
    if(chance(pa)){setTimeout(()=>_emig(iso,city),0);return 'Le pays '+C.n+' accepte votre dossier. Les frais ('+eur(fee)+') sont encaissés.'}
    d({happy:-4});return 'Les autorités de '+C.n+' refusent votre visa. Les frais ('+eur(fee)+') ne sont pas remboursés. Vous pourrez retenter l\'année prochaine.';
  }));
  choices.push(ch('Y aller illégalement ('+eur(route)+')',()=>{
    if(g.money<route)return 'Il vous faut '+eur(route)+' pour payer le passeur.';
    g.money-=route;
    if(chance(.62)){g.illegal=true;if(!g.homeCc)g.homeCc=g.cc;setTimeout(()=>_emig(iso,city),0);return 'Le passeur vous fait franchir la frontière sans visa. Vous êtes désormais en situation irrégulière.'}
    enqueue(()=>arrest({what:'une entrée illégale en '+C.n,term:[1,3],fine:0}));
    return 'La police des frontières vous intercepte !';
  }));
  choices.push(ch('Annuler',()=>''));
  showModal({title:'Visa pour '+C.n,rib:'Situation',sit:true,ic:'globe',text:'Pour vous installer à '+city+', il faut un visa payant, accordé ou non par le pays.'+(blk?' '+blk+' Votre seule option est d\'y aller illégalement, au risque de vous faire prendre.':''),choices});
};
function illegalYear(){

const CSEV={vol:0,pickpocket:0,bagarre:0,arnaque:1,cambrio:1,voiture:1,faux:1,hack:2,escro:2,fraude:2,chantage:2,dealer:2,braquage:3,kidnap:4};

crimeMini=function(kind){CRSEV=CSEV[kind]||0;try{_cm3(kind)}finally{CRSEV=0}};
const _mg3=miniGame;
miniGame=function(cfg,done){
  if(CRSEV>0&&g.prison<=0){
    const s=CRSEV;cfg=Object.assign({},cfg);
    if(cfg.speed)cfg.speed*=1+.2*s;
    if(cfg.zone)cfg.zone=Math.max(7,cfg.zone-3*s);
    if(cfg.fails&&s>=3)cfg.fails=Math.max(1,cfg.fails-1);
    if(cfg.steps&&s>=3)cfg.steps+=1;
    if(cfg.len)cfg.len+=s;
    cfg.intro=(cfg.intro||'')+' Crime '+(s>=3?'très grave':'grave')+' : le mini-jeu est plus rapide et la zone plus petite.';
  }
  return _mg3(cfg,done);
};

  if(g.did.friend){toast('Déjà fait cette année.');return}
  if(!meetsLeft()){toast('Vous avez déjà fait assez de rencontres dans cette vie (4 maximum).');return}
  g.did.friend=1;
  if(chance(.65)){g.meet=(g.meet||0)+1;const f=makeFriend();say('Nouvel ami : '+f.name+'.','good')}else say('Vous ne rencontrez personne d\'intéressant.');
};
const _oc=openCandidates;
openCandidates=function(b){
  if(!meetsLeft()){g.did.date=0;toast('Vous avez déjà fait assez de rencontres dans cette vie (4 maximum).');return}
  g.meet=(g.meet||0)+1;_oc(b);
};
/* procès : limités */
/* intimité : préservatif ou non, pas de choix de bébé */
intimate=function(p,id){
  const lover=p.kind==='partner'||p.kind==='spouse';
  if(!canIntimate(p)){say('Dans ce pays, l\'âge légal est de '+consentAge()+' ans : impossible.','bad');openPerson(id);return}
  if(!lover){
    const compat=g.orient==='bi'||(g.orient==='het'&&p.gender!==g.gender)||(g.orient==='homo'&&p.gender===g.gender);
    if(!compat||!chance(Math.min(.85,p.rel/100)*(p.rel>=55?1:.4))){
      use(p,'night');d({happy:-3});p.rel=clamp(p.rel-4);say(p.name+' n\'est pas intéressé'+(p.gender==='f'?'e':'')+' par cette idée.','bad');openPerson(id);return;
    }
  }
  const can=fertile(p)&&!hadBirth();
  const after=()=>{
    if(!lover&&!g.rels.some(r=>(r.kind==='partner'||r.kind==='spouse')&&r.alive)&&chance(.35)){p.kind='partner';L('Vous êtes maintenant en couple avec '+p.name+'.','good')}
    if(lawRisk(p,.35))return;
    openPerson(id);
  };
  const score=(bonus)=>clamp(Math.round(30+p.rel*.35+g.health*.08+g.looks*.08+rnd(-8,22)+(bonus||0)),3,100);
  const finish=(sc,msg)=>{d({happy:Math.max(1,Math.round(sc/12))});p.rel=clamp(p.rel+Math.round(sc/14));setTimeout(()=>pleasureCard(p,sc,msg,after),0);return ''};
  const choices=[];
  choices.push(ch('Avec préservatif',()=>{use(p,'night');return finish(score(0),'Une belle soirée, sans conséquence.')}));
  choices.push(ch('Sans préservatif',()=>{use(p,'night');const sc=score(5);let m='Une belle soirée, sans conséquence.';
    if(can&&chance(1/3)&&haveChild(p))m='Quelques semaines plus tard, un bébé est en route !';
    else if(chance(.08)){d({health:-5});if(!g.ill)g.ill={name:'Infection',sev:2,cure:.6,years:0};m='Un examen révèle une infection.'}
    return finish(sc,m)}));
  choices.push(ch('Renoncer',()=>{setTimeout(()=>openPerson(id),0);return ''}));
  showModal({title:'Intimité',nosurp:true,rib:'Situation',sit:true,ic:'heart',text:'Vous passez une soirée très tendre avec '+p.name+'. Si vous ne vous protégez pas, un bébé peut arriver (environ une chance sur trois).',choices});
};
/* meurtre : peut échouer, la cible peut vous tuer */
const MURDER_KILLBACK={mains:.3,blanche:.3,feu:.12,poison:.04,accident:.03};
murder=function(T,m){
  g.karma=clamp(g.karma-40);
  const ok=chance(m.ok);
  const R=T.rel;
  const caught=chance(clamp(m.caught+(T.fam?.15:0)+(g.record>0?.08:0)+(ok?0:.25),0,.95));
  if(ok){
    g.kills=(g.kills||0)+1;g.flags.murder=true;
    if(R)R.alive=false;
    g.rels.forEach(r=>{if(r.alive&&r!==R&&r.kind!=='pet'&&(T.fam||R)){r.rel=clamp(r.rel-(caught?60:12))}});
    d({happy:T.fam?-25:-10});
    let msg='Vous avez tué '+T.name+'.';
    if(caught)msg+=' La police remonte jusqu\'à vous.';
    else{g.wanted=(g.wanted||0)+3;msg+=' Personne ne vous soupçonne… pour l\'instant.'}
    closeSheet();say(msg,'bad');
    if(caught)enqueue(()=>arrest({what:'un meurtre',term:[15,40],fine:0}));
    return;
  }
  /* échec */
  closeSheet();
  const kb=(MURDER_KILLBACK[m.id]||.1)*(1.2-g.health/200)*(g.age>60?1.4:1);
  if(chance(clamp(kb,.02,.5))){
    shake();
    L(T.name+' prend le dessus et vous tue.','bad');
    die('avoir été tué'+genre('','e')+' par '+T.name+' lors d\'une tentative de meurtre');
    return;
  }
  d({health:-rnd(4,20)});shake();
  let msg='Votre tentative contre '+T.name+' échoue : '+T.name+' riposte et vous blesse.';
  if(R){R.rel=0;g.rels.forEach(r=>{if(r.alive&&r!==R&&r.kind!=='pet')r.rel=clamp(r.rel-8)})}
  if(caught)msg+=' La police est prévenue et vous arrête.';
  else{g.wanted=(g.wanted||0)+1;msg+=' Heureusement, personne ne vous a identifié'+genre('','e')+'.'}
  say(msg,'bad');
  if(caught)enqueue(()=>arrest({what:'une tentative de meurtre',term:[5,12],fine:0}));
};
/* sortir ensemble */
function askOut(p,id){
  p.asked=(p.asked||0)+1;
  const compat=g.orient==='bi'||(g.orient==='het'&&p.gender!==g.gender)||(g.orient==='homo'&&p.gender===g.gender);
  if(p.fz==null){
    /* attirance cachée : indépendante de la barre de relation */
    p.fz=(compat&&chance(clamp(.22+g.looks/260+(p.looks||50)/600+(p.rel>=60?.05:0),.1,.6)))?0:1;
  }
  if(p.fz===0){
    p.kind='partner';p.rel=Math.max(p.rel,rnd(55,75));p.src=null;d({happy:10});
    L(p.name+' accepte de sortir avec vous. Vous êtes maintenant en couple !','good');
    say(p.name+' accepte de sortir avec vous !','good');
    save();render();openRelations();
  }else{
    p.rel=clamp(p.rel-(p.rel>=80?2:6));d({happy:-5});
    say(p.name+' vous apprécie beaucoup, mais ne veut que rester ami'+(p.gender==='f'?'e':'')+'.','bad');
    openPerson(id);
  }
}

/* ---------- patch 15 : prison = relations avec les détenus uniquement ---------- */
function mkInmate(){
  const gender=chance(.85)?g.gender:(g.gender==='m'?'f':'m');
  const p=mkPerson('ami',clamp(g.age+rnd(-12,14),18,80),gender,rnd(5,35));
  p.name=rname(gender)+' '+rsur();p.src='Détenu';p.fz=1;return p;
}
function prisonSync(){
  if(!g||!g.alive)return;
  if(g.prison>0&&!g.inInm){
    g.outRels=g.rels;g.inInm=true;g.inStart=g.age;
    g.rels=[];const n=rnd(4,6);for(let i=0;i<n;i++)g.rels.push(mkInmate());
    if(!g.flags.inmN)g.flags.inmN=0;
  }else if(g.prison<=0&&g.inInm){
    const yrs=Math.max(0,g.age-(g.inStart||g.age));
    const back=g.outRels||[];
    back.forEach(r=>{if(!r.alive)return;r.age+=yrs;
      if(r.kind!=='pet'&&r.age>70&&chance(Math.min(.8,yrs*(r.age-60)/220))){r.alive=false;L(r.name+' est décédé'+(r.gender==='f'?'e':'')+' pendant votre incarcération.','bad')}
      else if(r.kind==='pet'&&chance(Math.min(.9,yrs*.12))){r.alive=false;L(r.name+' est mort pendant votre incarcération.','bad')}
      else if(r.kind!=='mere'&&r.kind!=='pere'&&r.kind!=='child'){r.rel=clamp(r.rel-yrs*4)}});
    g.rels=back;g.outRels=null;g.inInm=false;
  }
}

/* ---------- patch 16 : amis qui s'éloignent, causes de décès, combattant 3 matchs ---------- */
function friendYear(){
  if(!g||!g.alive||g.prison>0||g.inInm)return;
  const fr=g.rels.filter(r=>r.kind==='ami'&&r.alive&&r.src!=='Détenu'&&r.age>=6);
  if(!fr.length||!chance(.35))return;
  const p=pick(fr);
  if(chance(.5-p.rel/250)===false&&chance(.5))return;
  const why=pick([
    'a de moins en moins de temps pour vous','trouve que vous avez changé','pense que votre amitié s\'est refroidie',
    'a l\'impression que vous ne faites plus d\'efforts','s\'est rapproché'+(p.gender==='f'?'e':'')+' d\'autres personnes','vous reproche un vieux malentendu']);
  const f=p.gender==='f';
  enqueue(()=>showModal({title:'Amitié',rib:'Relation',sit:true,ic:'people',
    text:p.name+' vous dit qu\'il'+(f?'elle':'')+' ne veut plus être votre ami'+(f?'e':'')+' : '+(f?'elle ':'il ')+why+'.',
    choices:[
      ch('Essayer de recoller les morceaux',()=>{
        const pOk=clamp(.2+p.rel/160+(g.karma-50)/400,.1,.75);
        if(chance(pOk)){p.rel=Math.max(p.rel,rnd(45,60));d({happy:4});return p.name+' accepte de repartir sur de bonnes bases. L\'amitié est sauvée.'}
        p.alive=false;p.gone=true;d({happy:-6});return p.name+' refuse de rouvrir la discussion. L\'amitié est terminée.'}),
      ch('Le'+(f?'a':'')+' laisser partir',()=>{p.alive=false;p.gone=true;d({happy:-4});return 'Vous laissez '+p.name+' s\'éloigner. Vous ne vous parlerez plus.'})]}));
}
/* causes de décès détaillées */
function deathCause(){
  const ill=g.ill&&g.ill.name;
  const A=['un accident de la route','un accident de moto','une chute dans l\'escalier','une noyade','un incendie domestique','un accident de bricolage','un accident de montagne','un accident de travail','une chute de vélo','une électrocution','un accident de voiture sur autoroute'];
  const M=['un cancer','un cancer du pancréas','un AVC','une crise cardiaque','une pneumonie','un infarctus','une insuffisance rénale','une septicémie','une embolie pulmonaire','une méningite','une maladie rare'];
  const K=['une agression','un braquage qui a mal tourné','une balle perdue','un règlement de comptes','un meurtre commis par un inconnu'];
  let c,t;
  if(g.prison>0){c=pick(['une agression en prison','une bagarre dans la cour','une émeute en prison','un suicide forcé en cellule']);t='La vie derrière les barreaux a eu raison de vous.'}
  else if(g.addict&&g.addict.alcool&&chance(.4)){c='une cirrhose du foie';t='Des années d\'alcool ont eu raison de votre foie.'}
  else if(g.addict&&g.addict.tabac&&chance(.4)){c='un cancer du poumon';t='Des années de tabac vous ont rattrapé.'}
  else if(ill&&g.health<40&&chance(.7)){c=ill.toLowerCase().startsWith('un')||/^(la|le|l')/i.test(ill)?ill:'la maladie ('+ill+')';t='Votre maladie n\'a pu être vaincue.'}
  else if(g.wanted>2&&chance(.25)){c=pick(K);t='Votre passé criminel vous a rattrapé.'}
  else if(g.age>=80){c=pick(['des causes naturelles','la vieillesse','une insuffisance cardiaque']);t='Vous vous éteignez paisiblement.'}
  else if(g.health<25){c=pick(M);t='Votre santé fragile n\'a pas tenu.'}
  else if(g.age<30){c=pick(A.concat(A,K));t='Un coup du sort vous fauche trop jeune.'}
  else{const r=Math.random();c=r<.4?pick(A):r<.85?pick(M):pick(K);t=r<.4?'Un accident met fin à votre vie.':r<.85?'La maladie vous emporte.':'Vous êtes victime d\'un acte de violence.'}
  return [c,t];
}
checkDeath=function(){
  if(g.age<1)return false;
  const p=0.00005*Math.exp(0.095*g.age)*(1+(60-g.health)/100)*(1+Math.max(0,.9-(g.wage||1))*.8)+(g.age<30?0.0008:0);
  if(g.health<=0||chance(Math.max(0,p))){const [c,t]=deathCause();g.causeTxt=t;die(c);return true}
  return false;
};
checkHealth=function(){if(g&&g.alive&&g.health<=0){const [c,t]=deathCause();g.causeTxt=t;die(c)}};
const _sdP16=showDeath;
showDeath=function(earned,fresh){
  _sdP16(earned,fresh);
  try{const dl=document.querySelector('#death dl');if(dl){const dd=[...dl.querySelectorAll('dt')].find(x=>x.textContent==='Cause du décès');
    const row=document.createElement('div');row.style.cssText='margin:6px 0 0;font-size:13px;opacity:.85;grid-column:1/-1';
    row.textContent='Vous êtes mort'+genre('','e')+' de '+g.cause+'. '+(g.causeTxt||'');dl.appendChild(row)}}catch(e){}
};
/* combattant pro : 3 matchs par an */
mmaYear=function(){
  const J=g.job;if(!J||J.id!=='combattant'||g.prison>0)return;
  const m=mmaInit();m.tr=0;m.sp=0;
  if(g.age>35)m.skill=Math.max(10,m.skill-1.5);
  mmaSet();
  if(g.age>44){L('À votre âge, la ligue ne vous propose plus de combat.');return}
  enqueue(mmaFight);enqueue(mmaFight);enqueue(mmaFight);
};
